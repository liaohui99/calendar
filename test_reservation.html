<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>预约接口测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 20px;
        }
        .test-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #45a049;
        }
        .result {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>预约创建接口测试</h1>
        <div>
            <label>设备ID: <input type="number" id="deviceId" value="1"></label>
        </div>
        <div>
            <label>姓名: <input type="text" id="userName" value="测试用户"></label>
        </div>
        <div>
            <label>联系方式: <input type="text" id="userContact" value="13800138000"></label>
        </div>
        <div>
            <label>开始时间: <input type="datetime-local" id="startTime" value="2025-11-15T09:00"></label>
        </div>
        <div>
            <label>结束时间: <input type="datetime-local" id="endTime" value="2025-11-15T10:00"></label>
        </div>
        <div>
            <label>预约事由: <input type="text" id="reason" value="测试预约"></label>
        </div>
        <button onclick="testCreateReservation()">测试创建预约</button>
        <button onclick="testInvalidDeviceId()">测试无效设备ID</button>
        <button onclick="testMissingRequiredFields()">测试缺少必填字段</button>
        
        <h3>响应结果:</h3>
        <div class="result" id="result"></div>
    </div>

    <script>
        function logResult(message, type = 'info') {
            const resultDiv = document.getElementById('result');
            const timestamp = new Date().toLocaleTimeString();
            const color = type === 'error' ? '#f44336' : type === 'success' ? '#4CAF50' : '#2196F3';
            resultDiv.innerHTML += `<div style="color: ${color};">[${timestamp}] ${message}</div>`;
            resultDiv.scrollTop = resultDiv.scrollHeight;
        }

        async function createReservation(data) {
        const resultDiv = document.getElementById('result');
        resultDiv.innerHTML = '';
        logResult('发送请求...');
        logResult(`请求数据: ${JSON.stringify(data, null, 2)}`);
        
        try {
            // 转换时间格式为后端支持的格式
            const formattedData = {
                ...data,
                startTime: data.startTime ? data.startTime.replace('T', ' ') : null,
                endTime: data.endTime ? data.endTime.replace('T', ' ') : null
            };
            
            console.log('发送到后端的数据:', formattedData);
            
            // 直接访问后端API
            const response = await fetch('http://localhost:8080/api/reservations', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': '*/*'
                },
                body: JSON.stringify(formattedData),
                mode: 'cors'
            });
            
            // 记录响应状态
            logResult(`响应状态: ${response.status} ${response.statusText}`);
            
            // 尝试解析响应内容
            let responseData;
            try {
                responseData = await response.json();
                logResult(`响应数据: ${JSON.stringify(responseData, null, 2)}`);
            } catch (jsonError) {
                logResult(`JSON解析错误: ${jsonError.message}`, 'error');
                logResult('响应可能不是有效的JSON格式', 'error');
                return;
            }
            
            if (response.ok) {
                logResult('预约创建成功!', 'success');
            } else {
                logResult(`预约创建失败: ${responseData.message || '未知错误'}`, 'error');
            }
        } catch (error) {
            logResult(`请求错误: ${error.message}`, 'error');
            logResult('这可能是由于CORS配置问题或后端服务未运行', 'error');
            if (error.stack) {
                logResult(`错误堆栈: ${error.stack.substring(0, 500)}...`, 'error');
            }
        }
        }

        function testCreateReservation() {
            const data = {
                deviceId: parseInt(document.getElementById('deviceId').value),
                userName: document.getElementById('userName').value,
                userContact: document.getElementById('userContact').value,
                startTime: document.getElementById('startTime').value,
                endTime: document.getElementById('endTime').value,
                reason: document.getElementById('reason').value
            };
            createReservation(data);
        }

        function testInvalidDeviceId() {
            const data = {
                deviceId: -1, // 无效的设备ID
                userName: document.getElementById('userName').value,
                userContact: document.getElementById('userContact').value,
                startTime: document.getElementById('startTime').value,
                endTime: document.getElementById('endTime').value,
                reason: document.getElementById('reason').value
            };
            createReservation(data);
        }

        function testMissingRequiredFields() {
            const data = {
                // 故意省略必填字段
                deviceId: parseInt(document.getElementById('deviceId').value),
                // 缺少userName, userContact等字段
            };
            createReservation(data);
        }
    </script>
</body>
</html>
